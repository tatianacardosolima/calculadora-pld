name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # chamado pelo pld-diario.yml depois de atualizar os dados

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # pega o commit de dados recém-criado quando chamado pelo job diário

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Testes
        run: dotnet test tests/Calculadora.Tests --configuration Release

      - name: Publicar Blazor
        run: dotnet publish src/Calculadora.Web --configuration Release --output publicado

      - name: Ajustar para o GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s#<base href=\"/\" />#<base href=\"$BASE\" />#" publicado/wwwroot/index.html
          # Rotas internas funcionam ao recarregar a página
          cp publicado/wwwroot/index.html publicado/wwwroot/404.html
          # Sem isso o GitHub ignora a pasta _framework
          touch publicado/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publicado/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
